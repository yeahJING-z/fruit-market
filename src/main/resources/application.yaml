server:
  port: 8080

spring:
  application:
    name: fruit-market
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fruit_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your_password_here
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  web:
    resources:
      add-mappings: true

mybatis:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath:*.xml
  type-aliases-package: com.example.fruitmarket.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
